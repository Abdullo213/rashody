<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#101828;--mute:#6b7690;--line:#dfe4ee;--acc:#2f5bff;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c111b;--card:#161d2b;--ink:#eef2fb;--mute:#8b96ad;--line:#242d40;--acc:#6f8cff;--accink:#0c111b}}
:root[data-theme="dark"]{--bg:#0c111b;--card:#161d2b;--ink:#eef2fb;--mute:#8b96ad;--line:#242d40;--acc:#6f8cff;--accink:#0c111b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:240px}
body.alt{padding-bottom:100px}
main{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:9px 0;border-radius:11px}
.tabs button.on{background:var(--acc);color:var(--accink)}
.total{padding:22px 4px 8px}
.nav2{display:flex;align-items:center;gap:8px}.nav2 small{flex:1;text-align:center;font-weight:600;color:var(--mute);font-size:15px}
.nav2 button{border:0;background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:22px;line-height:1}.nav2 button:disabled{opacity:.3}
.total b{display:block;font-size:46px;line-height:1.15;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.cats,.card{background:var(--card);border-radius:18px;padding:6px 16px;margin-top:12px}
.card{padding:14px 16px}
.cat{padding:11px 0;border-bottom:1px solid var(--line)}.cat:last-child{border:0}
.cat .r{display:flex;justify-content:space-between;font-weight:600;gap:8px}
.cat .r span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
h2{font-size:15px;color:var(--mute);font-weight:600;margin:22px 4px 8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 8px 10px 12px;border-radius:14px;margin-bottom:6px}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.item .m{flex:1;min-width:0}
.item .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .m small{color:var(--mute)}
.item .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 5px}
.x.rc{font-size:18px;opacity:.35}.x.rc.has{opacity:1}
.empty{color:var(--mute);text-align:center;padding:28px 10px;line-height:1.5}
#bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
#bottom>*{max-width:520px;margin:0 auto}
.dock{padding:10px 12px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 11px;border-radius:999px}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--accink);font-weight:600}
.row{display:flex;gap:8px}
.row input,.fld{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.row input:focus,.fld:focus{border-color:var(--acc)}
.btn{border:0;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;font-size:16px;padding:0 18px;border-radius:14px;min-height:46px}
.btn:disabled{opacity:.35}.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:0 13px}
.hint{color:var(--mute);font-size:13px;margin:0 2px 8px;min-height:17px}
.rcbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 2px 8px}
.rcbar img{width:30px;height:30px;border-radius:6px;object-fit:cover}
nav#nav{display:flex;padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav#nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mute);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#nav button span{font-size:21px}nav#nav button.on{color:var(--acc);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;margin-top:14px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:10px;color:var(--mute);gap:4px}
.bw{width:100%;flex:1;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;background:var(--line);border-radius:5px 5px 2px 2px;min-height:2px}
.col.on{color:var(--ink);font-weight:700}.col.on .bw i{background:var(--acc)}
.sel{font-size:15px;color:var(--mute);font-weight:600}.big{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form .full{grid-column:1/3}
.lh{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.lm{color:var(--mute);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;background:#ef4444;color:#fff;padding:14px 16px;border-radius:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.warn{background:#f59e0b;color:#1a1200}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#ov img{max-width:100%;max-height:100%;border-radius:10px}
#sh{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#shb{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.tbl{background:var(--card);border-radius:14px;padding:6px 8px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 40px 58px 66px 24px;gap:4px;align-items:center;padding:3px 0}
.tr input{width:100%;min-width:0;font:inherit;font-size:14px;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.tr input:focus{border-color:var(--acc)}
.tr.th{font-size:12px;color:var(--mute);padding-bottom:0}.tr .x{font-size:18px;padding:0}
.hrow{display:flex;align-items:center;gap:8px}.hrow .hint{flex:1}
#dt{font:inherit;font-size:14px;padding:4px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
#toast.ok{background:#16a34a}
#cam{display:none}
#perm{min-height:32px;font-size:13px;padding:0 10px;flex:none}
</style>

</head>

<main id="v-lim" hidden>

<h2>Сохранность данных</h2>

<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="bexp">Сделать копию</button><button class="btn ghost" id="bpas">Вставить копию</button><button class="btn ghost" id="bfile">Из файла</button></div></div>

<div id="sh" hidden><div id="shb"></div></div>
<div id="bottom">
  <div class="dock" id="dock">
    <div class="hrow"><div class="hint" id="hint"></div><input type="date" id="dt" aria-label="Дата траты"></div>
    <div class="rcbar" id="rcbar" hidden><img id="rcimg" alt=""><span id="rctxt" style="flex:1"></span><button class="btn ghost" id="perm" hidden>Разрешить Claude</button><button class="x" id="rcx" aria-label="Убрать чек">×</button></div>
    <div class="chips" id="chips"></div>
    <div class="row"><button class="btn ghost" id="cam" aria-label="Чек">🧾</button><input id="inp" placeholder="Что и сколько?" enterkeyhint="done" autocomplete="off" autocapitalize="none"><button class="btn" id="add" disabled>Добавить</button></div>
  </div>
  <nav id="nav">
    <button data-v="home" class="on"><span>🏠</span>Главная</button>
    <button data-v="chart"><span>📊</span>Графики</button>
    <button data-v="lim"><span>🎯</span>Лимиты</button>
  </nav>
</div>

<script>
var CUR=" сом.";
var CATS=[
{id:"food",n:"Еда",e:"🍜",c:"#f59e0b",k:["еда","кафе","ресторан","обед","ужин","завтрак","кофе","пицца","суши","бургер","доставка","перекус","чай","шаурм","плов","самса","лагман","столов"]},
{id:"shop",n:"Продукты",e:"🛒",c:"#22c55e",k:["продукт","магазин","корзинк","базар","рынок","овощ","фрукт","молоко","хлеб","мясо","супермаркет"]},
{id:"fuel",n:"Заправка",e:"⛽",c:"#f97316",k:["бензин","заправк","азс","солярк","метан","пропан","дизел"]},
{id:"go",n:"Транспорт",e:"🚕",c:"#3b82f6",k:["такси","метро","автобус","проезд","маршрутк","самокат","парковк","билет"]},
{id:"wash",n:"Мойка",e:"🧽",c:"#0ea5e9",k:["мойк","автомойк"]},
{id:"tel",n:"Связь",e:"📱",c:"#a855f7",k:["связь","телефон","пополнен","баланс","tcell","мегафон","вавилон","zet","мобильн"]},
{id:"net",n:"Интернет",e:"🌐",c:"#6366f1",k:["интернет","wifi","wi-fi","вайфай","роутер","тариф"]},
{id:"util",n:"Коммуналка",e:"💡",c:"#eab308",k:["жкх","=свет","=вода","=газ","электр","отоплен","коммунал","мусор","водоканал"]},
{id:"home",n:"Дом",e:"🏠",c:"#8b5cf6",k:["аренд","квартир","мебел","ремонт","посуд","бытов"]},
{id:"buy",n:"Покупки",e:"🛍️",c:"#ec4899",k:["одежд","обув","wildberries","ozon","озон","покупк","техник","куртк","кроссов"]},
{id:"bday",n:"День рождения",e:"🎂",c:"#f43f5e",k:["день рожд","дня рожд","днюх","торт","юбиле","подар","свадьб","цветы"]},
{id:"kids",n:"Дети",e:"🧸",c:"#14b8a6",k:["детск","ребен","игрушк","памперс","садик"]},
{id:"edu",n:"Образование",e:"🎓",c:"#64748b",k:["курс","учеб","универ","репетит","школ","книг"]},
{id:"med",n:"Здоровье",e:"💊",c:"#ef4444",k:["аптек","врач","лекарств","стоматолог","анализ","спортзал","фитнес","массаж","больниц"]},
{id:"fun",n:"Досуг",e:"🎬",c:"#06b6d4",k:["кино","бар","игр","подписк","netflix","концерт","театр","клуб","кальян"]},
{id:"other",n:"Другое",e:"📦",c:"#94a3b8",k:[]}];
var P=[["day","Сегодня"],["week","Неделя"],["month","Месяц"]];
var CP=[["day","Дни"],["week","Недели"],["month","Месяцы"],["year","Годы"]];
var PN={day:"в день",week:"в неделю",month:"в месяц"};
var S={ex:[],learn:{},per:"month",lim:[]};
try{var raw=localStorage.getItem("rashody1");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
var cloud=null,synced={},st;
function cstat(t){var e=$("cloud");if(e)e.textContent=t}
function save(){try{localStorage.setItem("rashody1",JSON.stringify(S))}catch(e){}if(cloud){clearTimeout(st);st=setTimeout(flush,1200)}}
async function flush(){
  if(!cloud)return;
  try{
    var by={},k;
    S.ex.forEach(function(x){var d=new Date(x.t);k="m_"+d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);(by[k]=by[k]||[]).push(x)});
    for(k in synced)if(k!=="meta"&&!by[k])by[k]=[];
    for(k in by){var s=JSON.stringify(by[k]);if(synced[k]!==s){await cloud.doc(k).set({ex:by[k]});synced[k]=s}}
    var m=JSON.stringify({learn:S.learn,lim:S.lim,per:S.per});
    if(synced.meta!==m){await cloud.doc("meta").set({learn:S.learn,lim:S.lim,per:S.per});synced.meta=m}
    cstat("☁️ Данные сохранены в облаке Claude")
  }catch(e){cstat("⚠️ Облако не сохранило: "+(e.code||e.message))}
}
async function initCloud(){
  cstat("💾 Данные хранятся только на этом телефоне. Делай копию раз в неделю");
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
function refresh(){render();drawLim();drawChart()}
function mergeIn(d){
  if(!d||!Array.isArray(d.ex))throw 0;
  var have={},n=0;S.ex.forEach(function(x){have[x.id]=1});
  d.ex.forEach(function(x){if(x&&x.id&&!have[x.id]){S.ex.push(x);have[x.id]=1;n++}});
  for(var k in (d.learn||{}))if(!S.learn[k])S.learn[k]=d.learn[k];
  (d.lim||[]).forEach(function(l){if(!S.lim.some(function(z){return z.id===l.id}))S.lim.push(l)});
  S.ex.sort(function(a,b){return b.t-a.t});save();refresh();return n;
}
function importText(t){try{cstat("Восстановлено трат: "+mergeIn(JSON.parse(t).S))}catch(e){cstat("Не удалось прочитать копию")}}
$("bexp").onclick=async function(){
  var txt=JSON.stringify({v:1,S:S}),name="rashody-"+ymd(new Date())+".json";
  try{await navigator.clipboard.writeText(txt)}catch(z){}
  try{var dl=window.claude&&await claude.use("downloads");if(dl)await dl.save({filename:name,data:txt})}catch(e){}
  cstat("Копия скачана и скопирована в буфер. Для надёжности вставь её в Заметки")
};
$("bpas").onclick=async function(){try{importText(await navigator.clipboard.readText())}catch(e){cstat("Нет доступа к буферу обмена")}};
$("bfile").onclick=function(){$("bimp").click()};
$("bimp").onchange=function(){var f=this.files[0];this.value="";if(!f)return;var r=new FileReader();r.onload=function(){importText(r.result)};r.readAsText(f)};
function $(i){return document.getElementById(i)}
function cat(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[CATS.length-1]}
function fmt(n){return Math.round(n).toLocaleString("ru-RU").replace(/[\u00a0\u202f]/g," ")+CUR}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function parse(s){
  var re=/(\d+(?:[.,]\d+)?)\s*(к|k|тыс\.?)?(?![а-яa-z])/gi,m,last=null;
  while((m=re.exec(s))){last=m}
  if(!last)return null;
  var a=parseFloat(last[1].replace(",","."));if(last[2])a*=1000;
  var note=(s.slice(0,last.index)+" "+s.slice(last.index+last[0].length)).replace(/\s*(с|сом|сомони|смн|tjs)\.?\s*$/i," ").replace(/\s+/g," ").trim();
  return{a:a,note:note};
}
function guess(note){
  var t=note.toLowerCase(),tk=t.split(" "),w=tk[0];
  if(S.learn[w])return S.learn[w];
  for(var i=0;i<CATS.length;i++)for(var j=0;j<CATS[i].k.length;j++){var k=CATS[i].k[j];
    if(k[0]==="="?tk.indexOf(k.slice(1))>-1:t.indexOf(k)>-1)return CATS[i].id}
  return null;
}
/* toast + notifications */
var tt;
function alertMsg(msg,warn){
  var t=$("toast");t.textContent=msg;t.className=warn===true?"warn":(warn||"");t.hidden=false;
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{if("Notification" in window&&Notification.permission==="granted")new Notification("Расходы",{body:msg})}catch(e){}
  clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},7000);
}
$("toast").onclick=function(){this.hidden=true};
/* periods */
function range(per,o){
  var d=new Date();d.setHours(0,0,0,0);var e;
  if(per==="day"){d.setDate(d.getDate()+o);e=new Date(d);e.setDate(e.getDate()+1)}
  else if(per==="week"){d.setDate(d.getDate()-(d.getDay()+6)%7+o*7);e=new Date(d);e.setDate(e.getDate()+7)}
  else if(per==="year"){d.setMonth(0,1);d.setFullYear(d.getFullYear()+o);e=new Date(d);e.setFullYear(e.getFullYear()+1)}
  else{d.setDate(1);d.setMonth(d.getMonth()+o);e=new Date(d);e.setMonth(e.getMonth()+1)}
  return[d,e];
}
function long(per,r){
  var f=function(d,p){return d.toLocaleDateString("ru-RU",p)};
  if(per==="year")return String(r[0].getFullYear());
  if(per==="month")return f(r[0],{month:"long",year:"numeric"});
  if(per==="day")return f(r[0],{day:"numeric",month:"long"});
  return f(r[0],{day:"numeric",month:"short"})+" – "+f(new Date(r[1]-86400000),{day:"numeric",month:"short"});
}
function label(per,o,r){
  if(o===0)return{day:"Потрачено сегодня",week:"Потрачено на этой неделе",month:"Потрачено в этом месяце"}[per];
  return long(per,r);
}
function inR(x,r){return x.t>=r[0].getTime()&&x.t<r[1].getTime()}
function catRows(L,tot){
  var by={};L.forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
  return Object.keys(by).sort(function(a,b){return by[b]-by[a]}).map(function(id){var c=cat(id),pc=by[id]/tot*100;
    return '<div class="cat"><div class="r"><span>'+c.e+" "+c.n+"</span><span>"+fmt(by[id])+' <span style="color:var(--mute);font-weight:500">'+Math.round(pc)+'%</span></span></div><div class="bar"><i style="width:'+pc+"%;background:"+c.c+'"></i></div></div>'}).join("");
}
/* home */
var off=0,chosen=null,manual=false,rcd=null,dtTouched=false;
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function stamp(s){var n=new Date();if(!s)return n.getTime();var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2],n.getHours(),n.getMinutes(),n.getSeconds());return Math.min(d.getTime(),n.getTime())}
function render(){
  $("tabs").innerHTML=P.map(function(p){return '<button data-p="'+p[0]+'" class="'+(S.per===p[0]?"on":"")+'">'+p[1]+"</button>"}).join("");
  var r=range(S.per,off),L=S.ex.filter(function(x){return inR(x,r)}).sort(function(a,b){return b.t-a.t});
  var tot=L.reduce(function(a,x){return a+x.a},0);
  $("plabel").textContent=label(S.per,off,r);$("next").disabled=off>=0;$("sum").textContent=fmt(tot);
  var h=catRows(L,tot);$("cats").style.display=h?"block":"none";$("cats").innerHTML=h;
  if(!dtTouched)$("dt").value=ymd(off<0?r[0]:new Date());
  $("dt").max=ymd(new Date());
  $("list").innerHTML=L.length?L.slice(0,60).map(function(x){var c=cat(x.c),d=new Date(x.t);
    var when=d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    return '<div class="item" data-o="'+x.id+'" style="cursor:pointer"><div class="dot" style="background:'+c.c+'26">'+c.e+'</div><div class="m"><div>'+esc(x.n||c.n)+"</div><small>"+c.n+" · "+when+(x.it&&x.it.length?" · 🧾 "+x.it.length+" поз.":"")+'</small></div><span class="a">'+fmt(x.a)+'</span><button class="x" data-d="'+x.id+'" aria-label="Удалить">×</button></div>'}).join(""):
    '<div class="empty">Пока пусто.<br>Впиши трату внизу, например «кофе 25»</div>';
}
function drawChips(){$("chips").innerHTML=CATS.map(function(c){return '<button class="chip'+(chosen===c.id?" on":"")+'" data-c="'+c.id+'">'+c.e+" "+c.n+"</button>"}).join("")}
function onType(){
  var p=parse($("inp").value),ok=p&&p.a>0;$("add").disabled=!ok;
  if(ok){if(!manual)chosen=guess(p.note);$("hint").textContent=chosen?fmt(p.a)+" → "+cat(chosen).n:fmt(p.a)+" → выбери категорию"}
  else{$("hint").textContent="Пиши как в заметках: «кофе 25»";if(!manual)chosen=null}
  drawChips();
}
function add(){
  var p=parse($("inp").value);if(!p||!(p.a>0))return;
  var c=chosen||"other",w=p.note.toLowerCase().split(" ")[0],t=stamp($("dt").value),x={id:Date.now(),t:t,a:p.a,n:p.note,c:c};
  if(rcd&&rcd.items&&rcd.items.length)x.it=rcd.items;
  if(manual&&w&&w.length>2)S.learn[w]=c;
  S.ex.unshift(x);save();
  var inView=inR(x,range(S.per,off));
  $("inp").value="";chosen=null;manual=false;dtTouched=false;setRc(null);onType();render();checkLimits(x);
  if(!inView)alertMsg("Добавлено на "+new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})+". Листай ‹ › чтобы увидеть","ok");
}
$("add").onclick=add;
$("dt").addEventListener("change",function(){dtTouched=true});
$("inp").addEventListener("input",function(){manual=false;onType()});
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;chosen=b.dataset.c;manual=true;onType();$("inp").focus()});
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;S.per=b.dataset.p;off=0;dtTouched=false;save();render()});
$("prev").onclick=function(){off--;dtTouched=false;render()};
$("next").onclick=function(){if(off<0){off++;dtTouched=false;render()}};
$("list").addEventListener("click",function(e){
  var d=e.target.closest("[data-d]");
  if(d){var id=+d.dataset.d;S.ex=S.ex.filter(function(x){return x.id!==id});try{localStorage.removeItem("rc_"+id)}catch(z){}save();render();return}
  var o=e.target.closest("[data-o]");if(o)openD(+o.dataset.o);
});
$("ov").onclick=function(){this.hidden=true};

/* receipts */
function shrink(file){return new Promise(function(res,rej){
  var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(function(b){var r=new FileReader();r.onload=function(){res({blob:b,url:r.result})};r.readAsDataURL(b)},"image/jpeg",.85)};
  im.onerror=rej;im.src=u})}
function setRc(s,txt){$("rcbar").hidden=!s;if(s){$("rcimg").src=s.url;$("rctxt").textContent=txt||""}else rcd=null}
$("rcx").onclick=function(){setRc(null)};
async function fixPerm(){
  try{var pm=window.claude&&await claude.use("permissions");
    if(!pm){alertMsg("Здесь нет доступа к Claude. Открой приложение по ссылке из чата с Claude",true);return}
    var st=await pm.request(["sample"]);
    if(st.sample==="granted"){alertMsg("Доступ разрешён. Сфотографируй чек ещё раз","ok");return}
    await pm.manage();
    alertMsg((await pm.state("sample"))==="granted"?"Доступ включён. Сфотографируй чек ещё раз":"Включи доступ Claude в окне разрешений и повтори","ok");
  }catch(e){alertMsg("Не получилось открыть разрешения. Открой меню страницы в Claude, раздел Permissions",true)}
}
$("perm").onclick=fixPerm;
$("cam").onclick=function(){$("f1").click()};
function num(v){if(typeof v==="number")return isFinite(v)?v:0;var n=parseFloat(String(v==null?"":v).replace(/[\s\u00a0\u202f]/g,"").replace(",","."));return isFinite(n)?n:0}
function fail(code,msg){var e=new Error(msg);e.code=code;return e}
async function readReceipt(blob){
  var sm=window.claude&&await claude.use("sample");if(!sm)throw fail("no_sample","Claude недоступен");
  var lim=await sm.limits();if(!lim.images)throw fail("no_images","нет чтения фото");
  var ids=CATS.map(function(c){return c.id+"="+c.n}).join(", ");
  var r=await sm('Ты читаешь фото кассового чека. Верни ТОЛЬКО компактный JSON без пояснений и без markdown: {"shop":"название магазина","date":"ГГГГ-ММ-ДД или null","total":итоговая сумма к оплате числом,"category":"id из списка: '+ids+'","items":[{"n":"название товара","q":количество,"p":цена за единицу,"s":сумма по строке}]}. Числа пиши с точкой, без пробелов и без валюты. Названия товаров сокращай до 40 символов. Читай всё, что видно, ничего не выдумывай.',{images:[blob],modelTier:"default",cache:false});
  var t=r.text||"",a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<a)throw fail(r.truncated?"truncated":"no_json","ответ без данных");
  var d;try{d=JSON.parse(t.slice(a,b+1))}catch(e){throw fail(r.truncated?"truncated":"bad_json","не разобрал ответ")}
  var items=(Array.isArray(d.items)?d.items:[]).map(function(i){var q=num(i.q)||1,p=num(i.p),s=num(i.s);
    if(!s)s=Math.round(q*p*100)/100;if(!p&&q)p=Math.round(s/q*100)/100;
    return{n:String(i.n||"").slice(0,80),q:q,p:p,s:s}}).filter(function(i){return i.n||i.s});
  var total=num(d.total);if(!total)total=Math.round(items.reduce(function(a,i){return a+i.s},0)*100)/100;
  return{shop:String(d.shop||"").slice(0,40),date:/^\d{4}-\d\d-\d\d$/.test(d.date||"")?d.date:null,total:total,category:d.category,items:items};
}
function why(e){return e.code==="not_granted"?"нет разрешения Claude":e.code==="no_sample"?"открой приложение по ссылке из чата с Claude":(e.code||e.message||"ошибка")}
$("f1").onchange=async function(){
  var f=this.files[0];this.value="";if(!f)return;
  var s;try{s=await shrink(f)}catch(e){alertMsg("Не удалось открыть фото",true);return}
  rcd=null;setRc(s,"Читаю чек…");$("perm").hidden=true;
  try{var d=await readReceipt(s.blob);
    if(d.total>0||d.items.length){
      rcd=d;$("inp").value=((d.shop||"").replace(/[0-9]/g,"").trim()+" "+d.total).trim();
      if(CATS.some(function(c){return c.id===d.category})){chosen=d.category;manual=true}
      if(d.date&&d.date<=ymd(new Date())){$("dt").value=d.date;dtTouched=true}
      onType();setRc(s,"Прочитано: "+d.items.length+" поз., итого "+fmt(d.total)+". Проверь и нажми «Добавить»")}
    else setRc(s,"Не нашёл ни суммы, ни позиций. Сфотографируй ровнее и ближе")}
  catch(e){setRc(s,"Не удалось прочитать чек ("+why(e)+"). Впиши сумму вручную");$("perm").hidden=e.code!=="not_granted"}
};
/* expense details */
var cur=null;
function openD(id){cur=S.ex.filter(function(x){return x.id===id})[0];if(!cur)return;drawD();$("sh").hidden=false}
function closeD(){$("sh").hidden=true;cur=null;render()}
function tsum(){return Math.round((cur.it||[]).reduce(function(a,r){return a+r.s},0)*100)/100}
function foot(){var t=tsum(),h="Итого по таблице: <b>"+fmt(t)+"</b> ";
  if(cur.it&&cur.it.length&&Math.abs(t-cur.a)>0.5)h+='<button class="btn ghost" id="dsync" style="min-height:34px;font-size:13px;padding:0 10px">Сделать суммой расхода</button>';
  $("dfoot").innerHTML=h}
function rows(){$("drows").innerHTML=(cur.it||[]).map(function(r,i){
  return '<div class="tr" data-i="'+i+'"><input data-f="n" value="'+esc(r.n)+'" placeholder="Товар"><input data-f="q" inputmode="decimal" value="'+r.q+'"><input data-f="p" inputmode="decimal" value="'+r.p+'"><input data-f="s" inputmode="decimal" value="'+r.s+'"><button class="x" data-rm="'+i+'" aria-label="Убрать строку">×</button></div>'}).join("")||'<div class="empty" style="padding:14px">Таблицы пока нет. Добавь строки кнопкой «+ Строка».</div>'}
function drawD(){
  var x=cur,old=false;try{old=!!(x.r&&localStorage.getItem("rc_"+x.id))}catch(e){}
  $("shb").innerHTML='<div class="lh"><span style="font-size:18px">Расход</span><button class="x" id="dclose" aria-label="Закрыть">×</button></div>'+
  '<div class="form" style="margin-top:10px"><input class="fld full" id="dn" placeholder="Название" value="'+esc(x.n||"")+'">'+
  '<input class="fld" id="dd" type="date" max="'+ymd(new Date())+'" value="'+ymd(new Date(x.t))+'"><input class="fld" id="da" inputmode="decimal" value="'+x.a+'">'+
  '<select class="fld full" id="dc">'+CATS.map(function(c){return '<option value="'+c.id+'"'+(c.id===x.c?" selected":"")+">"+c.e+" "+c.n+"</option>"}).join("")+'</select></div>'+
  '<h2>Чек по позициям</h2><div class="tbl"><div class="tr th"><span>Товар</span><span>Кол.</span><span>Цена</span><span>Сумма</span><span></span></div><div id="drows"></div></div>'+
  '<div class="lm" id="dfoot" style="margin-top:8px"></div><div class="hint" id="dst" style="margin-top:6px"></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="dnew">+ Строка</button>'+(old?'<button class="btn ghost" id="dold">Старое фото</button>':"")+"</div>";
  rows();foot();
}
$("sh").onclick=function(e){if(e.target===this)closeD()};
$("shb").addEventListener("input",function(e){
  var t=e.target,row=t.closest(".tr");
  if(!cur||!row||!t.dataset.f)return;
  var r=cur.it[+row.dataset.i],f=t.dataset.f;
  if(f==="n")r.n=t.value;else{r[f]=num(t.value);if(f!=="s"){r.s=Math.round(r.q*r.p*100)/100;row.querySelector('[data-f="s"]').value=r.s}}
  save();foot();
});
$("shb").addEventListener("change",function(e){
  var t=e.target;if(!cur)return;
  if(t.id==="dn")cur.n=t.value.trim();
  else if(t.id==="da"){var a=num(t.value);if(a>0)cur.a=a;t.value=cur.a;foot()}
  else if(t.id==="dd"&&t.value){var o=new Date(cur.t),p=t.value.split("-");cur.t=Math.min(new Date(+p[0],+p[1]-1,+p[2],o.getHours(),o.getMinutes()).getTime(),Date.now())}
  else if(t.id==="dc")cur.c=t.value;
  save();
});
$("shb").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!cur)return;
  if(b.id==="dclose")closeD();
  else if(b.id==="dnew"){(cur.it=cur.it||[]).push({n:"",q:1,p:0,s:0});save();rows();foot()}
  else if(b.hasAttribute("data-rm")){cur.it.splice(+b.dataset.rm,1);save();rows();foot()}
  else if(b.id==="dsync"){cur.a=tsum();save();$("da").value=cur.a;foot()}
  else if(b.id==="dscan")$("f2").click();
  else if(b.id==="dperm")fixPerm();
  else if(b.id==="dold"){var u=null;try{u=localStorage.getItem("rc_"+cur.id)}catch(z){}if(u){$("ov").querySelector("img").src=u;$("ov").hidden=false}}
});
$("f2").onchange=async function(){
  var f=this.files[0];this.value="";if(!f||!cur)return;var x=cur;
  $("dst").textContent="Читаю чек…";
  try{var s=await shrink(f),d=await readReceipt(s.blob);
    if(!d.items.length&&!(d.total>0)){$("dst").textContent="Не нашёл позиций. Сфотографируй ровнее и ближе";return}
    x.it=(x.it||[]).concat(d.items.length?d.items:[{n:d.shop||"Покупка",q:1,p:d.total,s:d.total}]);
    if(!x.n&&d.shop)x.n=d.shop;save();
    if(cur===x){drawD();$("dst").textContent="Готово: добавлено "+(d.items.length||1)+" поз."}}
  catch(e){$("dst").textContent="Не удалось прочитать чек ("+why(e)+") ";if(e.code==="not_granted")$("dst").insertAdjacentHTML("beforeend",'<button class="btn ghost" id="dperm" style="min-height:34px;font-size:13px;padding:0 10px">Разрешить Claude</button>')}
};

/* charts */
var cp="day",csel=-1;
function drawChart(){
  $("ctabs").innerHTML=CP.map(function(p){return '<button data-p="'+p[0]+'" class="'+(cp===p[0]?"on":"")+'">'+p[1]+"</button>"}).join("");
  var n={day:14,week:12,month:12,year:5}[cp],bs=[],i;
  for(i=n-1;i>=0;i--){var r=range(cp,-i),v=0;S.ex.forEach(function(x){if(inR(x,r))v+=x.a});bs.push({r:r,v:v})}
  if(csel<0||csel>=n)csel=n-1;
  var mx=Math.max.apply(null,bs.map(function(b){return b.v}))||1,sum=bs.reduce(function(a,b){return a+b.v},0);
  $("chart").innerHTML=bs.map(function(b,i){var d=b.r[0],lb=cp==="day"?d.getDate():cp==="week"?d.getDate()+"."+("0"+(d.getMonth()+1)).slice(-2):cp==="month"?d.toLocaleDateString("ru-RU",{month:"short"}).replace(".",""):d.getFullYear();
    return '<div class="col'+(i===csel?" on":"")+'" data-i="'+i+'"><div class="bw"><i style="height:'+(b.v/mx*100)+'%"></i></div><span>'+lb+"</span></div>"}).join("");
  var b=bs[csel];$("csel").textContent=long(cp,b.r);$("cval").textContent=fmt(b.v);
  $("cavg").textContent="В среднем за период: "+fmt(sum/n);
  var L=S.ex.filter(function(x){return inR(x,b.r)}),h=catRows(L,b.v);
  $("ccats").style.display=h?"block":"none";$("ccats").innerHTML=h;
}
$("ctabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;cp=b.dataset.p;csel=-1;drawChart()});
$("chart").addEventListener("click",function(e){var c=e.target.closest(".col");if(!c)return;csel=+c.dataset.i;drawChart()});
/* limits */
function spent(l){var r=range(l.p,0),s=0;S.ex.forEach(function(x){if(inR(x,r)&&(l.c==="all"||x.c===l.c))s+=x.a});return s}
function checkLimits(x){
  S.lim.forEach(function(l){
    if(l.c!=="all"&&l.c!==x.c)return;if(!inR(x,range(l.p,0)))return;
    var sp=spent(l),bf=sp-x.a,nm=(l.c==="all"?"Все расходы":cat(l.c).n)+" "+PN[l.p];
    if(sp>=l.a&&bf<l.a)alertMsg("⛔ Лимит исчерпан: "+nm+". Потрачено "+fmt(sp)+" из "+fmt(l.a));
    else if(sp>=l.a*.8&&bf<l.a*.8&&sp<l.a)alertMsg("⚠️ Почти лимит: "+nm+". Осталось "+fmt(l.a-sp),true);
  });
}
function drawLim(){
  $("lc").innerHTML='<option value="all">💰 Все расходы</option>'+CATS.map(function(c){return '<option value="'+c.id+'">'+c.e+" "+c.n+"</option>"}).join("");
  var can="Notification" in window;
  $("nbtn").hidden=!(can&&Notification.permission==="default");
  $("nhint").textContent="Сообщение о лимите появится сразу, как только ты добавишь трату, которая его достигает"+(can?" (и придёт уведомлением, если разрешить).":".");
  $("llist").innerHTML=S.lim.length?S.lim.map(function(l,i){
    var sp=spent(l),p=sp/l.a*100,c=l.c==="all"?{e:"💰",n:"Все расходы"}:cat(l.c),col=p>=100?"#ef4444":p>=80?"#f59e0b":"var(--acc)";
    return '<div class="card"><div class="lh"><span>'+c.e+" "+c.n+" · "+PN[l.p]+'</span><button class="x" data-l="'+i+'" aria-label="Удалить">×</button></div><div class="bar"><i style="width:'+Math.min(100,p)+"%;background:"+col+'"></i></div><div class="lm">'+fmt(sp)+" из "+fmt(l.a)+(p>=100?" — лимит превышен":" · осталось "+fmt(l.a-sp))+"</div></div>"}).join(""):
    '<div class="empty">Лимитов пока нет.<br>Например: Заправка — 800 в месяц.</div>';
}
$("ladd").onclick=function(){
  var a=parseFloat($("la").value);if(!(a>0))return;
  S.lim.push({id:Date.now(),c:$("lc").value,p:$("lp").value,a:a});save();$("la").value="";drawLim();
};
$("llist").addEventListener("click",function(e){var b=e.target.closest("[data-l]");if(!b)return;S.lim.splice(+b.dataset.l,1);save();drawLim()});
$("nbtn").onclick=function(){try{Notification.requestPermission().then(drawLim)}catch(e){}};
/* navigation */
function view(v){
  ["home","chart","lim"].forEach(function(k){$("v-"+k).hidden=k!==v});
  $("dock").hidden=v!=="home";document.body.className=v==="home"?"":"alt";
  Array.prototype.forEach.call($("nav").children,function(b){b.className=b.dataset.v===v?"on":""});
  if(v==="chart")drawChart();if(v==="lim")drawLim();if(v==="home")render();
  window.scrollTo(0,0);
}
$("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(b)view(b.dataset.v)});
onType();render();initCloud();
</script>

<title>Расходы</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#101828;--mute:#6b7690;--line:#dfe4ee;--acc:#2f5bff;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c111b;--card:#161d2b;--ink:#eef2fb;--mute:#8b96ad;--line:#242d40;--acc:#6f8cff;--accink:#0c111b}}
:root[data-theme="dark"]{--bg:#0c111b;--card:#161d2b;--ink:#eef2fb;--mute:#8b96ad;--line:#242d40;--acc:#6f8cff;--accink:#0c111b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:240px}
body.alt{padding-bottom:100px}
main{max-width:520px;margin:0 auto;padding:16px}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:9px 0;border-radius:11px}
.tabs button.on{background:var(--acc);color:var(--accink)}
.total{padding:22px 4px 8px}
.nav2{display:flex;align-items:center;gap:8px}.nav2 small{flex:1;text-align:center;font-weight:600;color:var(--mute);font-size:15px}
.nav2 button{border:0;background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:22px;line-height:1}.nav2 button:disabled{opacity:.3}
.total b{display:block;font-size:46px;line-height:1.15;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.cats,.card{background:var(--card);border-radius:18px;padding:6px 16px;margin-top:12px}
.card{padding:14px 16px}
.cat{padding:11px 0;border-bottom:1px solid var(--line)}.cat:last-child{border:0}
.cat .r{display:flex;justify-content:space-between;font-weight:600;gap:8px}
.cat .r span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
h2{font-size:15px;color:var(--mute);font-weight:600;margin:22px 4px 8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 8px 10px 12px;border-radius:14px;margin-bottom:6px}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}
.item .m{flex:1;min-width:0}
.item .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .m small{color:var(--mute)}
.item .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 5px}
.x.rc{font-size:18px;opacity:.35}.x.rc.has{opacity:1}
.empty{color:var(--mute);text-align:center;padding:28px 10px;line-height:1.5}
#bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
#bottom>*{max-width:520px;margin:0 auto}
.dock{padding:10px 12px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:6px 11px;border-radius:999px}
.chip.on{border-color:var(--acc);background:var(--acc);color:var(--accink);font-weight:600}
.row{display:flex;gap:8px}
.row input,.fld{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.row input:focus,.fld:focus{border-color:var(--acc)}
.btn{border:0;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;font-size:16px;padding:0 18px;border-radius:14px;min-height:46px}
.btn:disabled{opacity:.35}.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:0 13px}
.hint{color:var(--mute);font-size:13px;margin:0 2px 8px;min-height:17px}
.rcbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 2px 8px}
.rcbar img{width:30px;height:30px;border-radius:6px;object-fit:cover}
nav#nav{display:flex;padding:4px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav#nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mute);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav#nav button span{font-size:21px}nav#nav button.on{color:var(--acc);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;margin-top:14px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;font-size:10px;color:var(--mute);gap:4px}
.bw{width:100%;flex:1;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;background:var(--line);border-radius:5px 5px 2px 2px;min-height:2px}
.col.on{color:var(--ink);font-weight:700}.col.on .bw i{background:var(--acc)}
.sel{font-size:15px;color:var(--mute);font-weight:600}.big{font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form .full{grid-column:1/3}
.lh{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.lm{color:var(--mute);font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;background:#ef4444;color:#fff;padding:14px 16px;border-radius:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.warn{background:#f59e0b;color:#1a1200}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
#ov img{max-width:100%;max-height:100%;border-radius:10px}
#sh{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#shb{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.tbl{background:var(--card);border-radius:14px;padding:6px 8px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 40px 58px 66px 24px;gap:4px;align-items:center;padding:3px 0}
.tr input{width:100%;min-width:0;font:inherit;font-size:14px;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
.tr input:focus{border-color:var(--acc)}
.tr.th{font-size:12px;color:var(--mute);padding-bottom:0}.tr .x{font-size:18px;padding:0}
.hrow{display:flex;align-items:center;gap:8px}.hrow .hint{flex:1}
#dt{font:inherit;font-size:14px;padding:4px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
#toast.ok{background:#16a34a}
#cam{display:none}
#perm{min-height:32px;font-size:13px;padding:0 10px;flex:none}
.kpi{display:flex;gap:10px;margin-top:8px}.kpi>div{flex:1;background:var(--card);border-radius:14px;padding:10px 12px}.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.g{color:#16a34a}.r{color:#ef4444}
.btn.inc{background:#16a34a;color:#fff;border-color:#16a34a}
#wal{max-width:36%;font:inherit;font-size:14px;padding:4px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:12px}
.cal .wd{text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.dc{min-height:58px;border-radius:10px;background:var(--bg);padding:3px 1px;text-align:center;font-size:12px;overflow:hidden}
.dc.on{outline:2px solid var(--acc)}.dc span{display:block;font-weight:600;color:var(--mute);margin-bottom:1px}
.dc em{display:block;font-style:normal;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cr{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-variant-numeric:tabular-nums}.cr:last-child{border:0}
.cr small{display:block;color:var(--mute)}.dl{font-weight:700;font-size:13px;min-width:64px;text-align:right}
.ins{padding-left:18px;margin:6px 0}.ins li{margin:7px 0;line-height:1.4}
.item .a.g{color:#16a34a}
.bw{position:relative}
.bw.p{gap:2px}.bw.p i{width:50%}
.bw.s{flex-direction:column-reverse;align-items:stretch;justify-content:flex-start}.bw.s i{border-radius:0;min-height:0}
.ls{position:absolute;left:0;top:0;width:100%;height:calc(100% - 18px);pointer-events:none}
.bw i.dp{position:absolute;left:50%;transform:translate(-50%,50%);width:7px;height:7px;border-radius:50%;min-height:0}
.col.on .bw i.dp{width:11px;height:11px}
.mpair .bw i,.mstack .bw i{opacity:.6}.mpair .col.on .bw i,.mstack .col.on .bw i{opacity:1}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mute)}.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.tabs.sm button{font-size:13px;padding:7px 0}
</style>

</head>

<div id="ov" hidden><img alt="Чек"></div>

<main id="v-home">

  <div class="cats" id="ccats"></div>

<h2>Сохранность данных</h2>

<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="bexp">Сделать копию</button><button class="btn ghost" id="bpas">Вставить копию</button><button class="btn ghost" id="bfile">Из файла</button></div></div>
</main>

<main id="v-cal" hidden>
  <div class="card"><div class="nav2"><button id="cprev" aria-label="Назад">‹</button><small id="cm"></small><button id="cnext" aria-label="Вперёд">›</button></div>

</main>

  <h2>Финансовые цели</h2>
  <div id="goals"></div>
  <div class="card"><div class="form"><input class="fld full" id="gn" placeholder="Цель, например «Отпуск»"><input class="fld" id="gt" type="number" inputmode="decimal" placeholder="Сколько нужно"><input class="fld" id="gd" type="date" aria-label="К какой дате"><button class="btn full" id="gadd">Добавить цель</button></div></div>
  <h2>Регулярные платежи</h2>
  <div id="rlist"></div>
  <div class="card"><div class="form"><input class="fld full" id="rn" placeholder="Название, например «Аренда»"><input class="fld" id="ra" type="number" inputmode="decimal" placeholder="Сумма"><select class="fld" id="rf"><option value="month">Каждый месяц</option><option value="week">Каждую неделю</option><option value="year">Каждый год</option></select><select class="fld full" id="rcat"></select><select class="fld" id="rw"></select><input class="fld" id="rd" type="date" aria-label="Первый платёж"><button class="btn full" id="radd">Добавить платёж</button></div><div class="hint" style="margin:10px 0 0">Платёж добавится сам в день, который выберешь первым («Первый платёж»), и дальше по расписанию. Пусто = сегодня.</div></div>
  <h2>Поиск и фильтр</h2>
  <div class="card" id="srch"><div class="form"><input class="fld full" id="q" placeholder="Слово: название или категория"><select class="fld" id="qt"><option value="">Доходы и расходы</option><option value="e">Только расходы</option><option value="i">Только доходы</option></select><select class="fld" id="qc"></select><select class="fld full" id="qa"></select><input class="fld" id="q1" type="date" aria-label="С даты"><input class="fld" id="q2" type="date" aria-label="По дату"><input class="fld" id="qmin" type="number" inputmode="decimal" placeholder="Сумма от"><input class="fld" id="qmax" type="number" inputmode="decimal" placeholder="Сумма до"></div></div>
  <div id="sres"></div>
  <h2>Экспорт</h2>
  <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="xcsv">Таблица CSV (Excel)</button><button class="btn ghost" id="xjson">Копия JSON</button><button class="btn ghost" id="xtxt">Отчёт TXT</button></div><div class="hint" id="xst" style="margin:10px 0 0"></div></div>
</main>

function mergeIn(d){

  var have={},n=0;S.ex.forEach(function(x){have[x.id]=1});

function cat(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[CATS.length-1]}
function fmt(n){return Math.round(n).toLocaleString("ru-RU").replace(/[\u00a0\u202f]/g," ")+CUR}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function parse(s){
  var re=/(\d+(?:[.,]\d+)?)\s*(к|k|тыс\.?)?(?![а-яa-z])/gi,m,last=null;
  while((m=re.exec(s))){last=m}
  if(!last)return null;
  var a=parseFloat(last[1].replace(",","."));if(last[2])a*=1000;
  var note=(s.slice(0,last.index)+" "+s.slice(last.index+last[0].length)).replace(/\s*(с|сом|сомони|смн|tjs)\.?\s*$/i," ").replace(/\s+/g," ").trim();
  return{a:a,note:note};
}
function guess(note){
  var t=note.toLowerCase(),tk=t.split(" "),w=tk[0];
  if(S.learn[w])return S.learn[w];
  for(var i=0;i<CATS.length;i++)for(var j=0;j<CATS[i].k.length;j++){var k=CATS[i].k[j];
    if(k[0]==="="?tk.indexOf(k.slice(1))>-1:t.indexOf(k)>-1)return CATS[i].id}
  return null;
}

/* periods */
function range(per,o){
  var d=new Date();d.setHours(0,0,0,0);var e;
  if(per==="day"){d.setDate(d.getDate()+o);e=new Date(d);e.setDate(e.getDate()+1)}
  else if(per==="week"){d.setDate(d.getDate()-(d.getDay()+6)%7+o*7);e=new Date(d);e.setDate(e.getDate()+7)}
  else if(per==="year"){d.setMonth(0,1);d.setFullYear(d.getFullYear()+o);e=new Date(d);e.setFullYear(e.getFullYear()+1)}
  else{d.setDate(1);d.setMonth(d.getMonth()+o);e=new Date(d);e.setMonth(e.getMonth()+1)}
  return[d,e];
}
function long(per,r){
  var f=function(d,p){return d.toLocaleDateString("ru-RU",p)};
  if(per==="year")return String(r[0].getFullYear());
  if(per==="month")return f(r[0],{month:"long",year:"numeric"});
  if(per==="day")return f(r[0],{day:"numeric",month:"long"});
  return f(r[0],{day:"numeric",month:"short"})+" – "+f(new Date(r[1]-86400000),{day:"numeric",month:"short"});
}
function label(per,o,r){
  if(o===0)return{day:"Потрачено сегодня",week:"Потрачено на этой неделе",month:"Потрачено в этом месяце"}[per];
  return long(per,r);
}
function inR(x,r){return x.t>=r[0].getTime()&&x.t<r[1].getTime()}
function catRows(L,tot){
  var by={};L.forEach(function(x){by[x.c]=(by[x.c]||0)+x.a});
  return Object.keys(by).sort(function(a,b){return by[b]-by[a]}).map(function(id){var c=cat(id),pc=by[id]/tot*100;
    return '<div class="cat"><div class="r"><span>'+c.e+" "+c.n+"</span><span>"+fmt(by[id])+' <span style="color:var(--mute);font-weight:500">'+Math.round(pc)+'%</span></span></div><div class="bar"><i style="width:'+pc+"%;background:"+c.c+'"></i></div></div>'}).join("");
}

/* receipts */
function shrink(file){return new Promise(function(res,rej){
  var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(function(b){var r=new FileReader();r.onload=function(){res({blob:b,url:r.result})};r.readAsDataURL(b)},"image/jpeg",.85)};
  im.onerror=rej;im.src=u})}
function setRc(s,txt){$("rcbar").hidden=!s;if(s){$("rcimg").src=s.url;$("rctxt").textContent=txt||""}else rcd=null}

    if(!pm){alertMsg("Здесь нет доступа к Claude. Открой приложение по ссылке из чата с Claude",true);return}
    var st=await pm.request(["sample"]);
    if(st.sample==="granted"){alertMsg("Доступ разрешён. Сфотографируй чек ещё раз","ok");return}
    await pm.manage();
    alertMsg((await pm.state("sample"))==="granted"?"Доступ включён. Сфотографируй чек ещё раз":"Включи доступ Claude в окне разрешений и повтори","ok");
  }catch(e){alertMsg("Не получилось открыть разрешения. Открой меню страницы в Claude, раздел Permissions",true)}
}

function num(v){if(typeof v==="number")return isFinite(v)?v:0;var n=parseFloat(String(v==null?"":v).replace(/[\s\u00a0\u202f]/g,"").replace(",","."));return isFinite(n)?n:0}
function fail(code,msg){var e=new Error(msg);e.code=code;return e}
async function readReceipt(blob){
  var sm=window.claude&&await claude.use("sample");if(!sm)throw fail("no_sample","Claude недоступен");
  var lim=await sm.limits();if(!lim.images)throw fail("no_images","нет чтения фото");
  var ids=CATS.map(function(c){return c.id+"="+c.n}).join(", ");
  var r=await sm('Ты читаешь фото кассового чека. Верни ТОЛЬКО компактный JSON без пояснений и без markdown: {"shop":"название магазина","date":"ГГГГ-ММ-ДД или null","total":итоговая сумма к оплате числом,"category":"id из списка: '+ids+'","items":[{"n":"название товара","q":количество,"p":цена за единицу,"s":сумма по строке}]}. Числа пиши с точкой, без пробелов и без валюты. Названия товаров сокращай до 40 символов. Читай всё, что видно, ничего не выдумывай.',{images:[blob],modelTier:"default",cache:false});
  var t=r.text||"",a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<a)throw fail(r.truncated?"truncated":"no_json","ответ без данных");
  var d;try{d=JSON.parse(t.slice(a,b+1))}catch(e){throw fail(r.truncated?"truncated":"bad_json","не разобрал ответ")}
  var items=(Array.isArray(d.items)?d.items:[]).map(function(i){var q=num(i.q)||1,p=num(i.p),s=num(i.s);
    if(!s)s=Math.round(q*p*100)/100;if(!p&&q)p=Math.round(s/q*100)/100;
    return{n:String(i.n||"").slice(0,80),q:q,p:p,s:s}}).filter(function(i){return i.n||i.s});
  var total=num(d.total);if(!total)total=Math.round(items.reduce(function(a,i){return a+i.s},0)*100)/100;
  return{shop:String(d.shop||"").slice(0,40),date:/^\d{4}-\d\d-\d\d$/.test(d.date||"")?d.date:null,total:total,category:d.category,items:items};
}
function why(e){return e.code==="not_granted"?"нет разрешения Claude":e.code==="no_sample"?"открой приложение по ссылке из чата с Claude":(e.code||e.message||"ошибка")}

<script>
/* v2: доходы, счета, цели, календарь, анализ, поиск, экспорт */
var CIN=[{id:"sal",n:"Зарплата",e:"💼",c:"#16a34a",k:["зарплат","аванс","оклад","премия"]},{id:"side",n:"Подработка",e:"🛠️",c:"#0d9488",k:["подработ","заказ","фриланс","клиент"]},{id:"gift",n:"Подарок",e:"🎁",c:"#db2777",k:["подар","перевод"]},{id:"oth",n:"Другое",e:"💰",c:"#65a30d",k:[]}];
var WD=["воскресеньям","понедельникам","вторникам","средам","четвергам","пятницам","субботам"],mode="e",cmo=0,cd=null;
if(!S.inc)S.inc=[];if(!S.goals)S.goals=[];
if(!S.acc||!S.acc.length)S.acc=[{id:"cash",n:"Наличные",e:"💵",s:0},{id:"card",n:"Карта",e:"💳",s:0}];
cat=function(id){return CATS.concat(CIN).filter(function(c){return c.id===id})[0]||CATS[CATS.length-1]};
function guessIn(n){var t=n.toLowerCase();for(var i=0;i<CIN.length;i++)for(var j=0;j<CIN[i].k.length;j++)if(t.indexOf(CIN[i].k[j])>-1)return CIN[i].id;return null}
function wid(x){return S.acc.some(function(a){return a.id===x.w})?x.w:S.acc[0].id}
function accBal(a){var b=num(a.s);S.inc.forEach(function(x){if(wid(x)===a.id)b+=x.a});S.ex.forEach(function(x){if(wid(x)===a.id)b-=x.a});return b}
function sumR(a,r){var s=0;a.forEach(function(x){if(inR(x,r))s+=x.a});return s}
function kf(n){n=Math.round(n);return n>=10000?Math.round(n/1000)+"к":n>=1000?(n/1000).toFixed(1).replace(".0","")+"к":String(n)}
drawChips=function(){var L=mode==="i"?CIN:CATS;$("chips").innerHTML=L.map(function(c){return '<button class="chip'+(chosen===c.id?" on":"")+'" data-c="'+c.id+'">'+c.e+" "+c.n+"</button>"}).join("")};

};
$("mode").onclick=function(){mode=mode==="e"?"i":"e";this.textContent=mode==="e"?"−":"+";this.className="btn ghost"+(mode==="i"?" inc":"");chosen=null;manual=false;onType()};
var _add=add;
add=function(){
  var p=parse($("inp").value);if(!p||!(p.a>0))return;
  if(mode==="i"){
    S.inc.unshift({id:Date.now(),t:stamp($("dt").value),a:p.a,n:p.note,c:chosen||"oth",w:$("wal").value});
    S.inc.sort(function(a,b){return b.t-a.t});save();

  var w=$("wal").value;_add();if(S.ex[0]){S.ex[0].w=w;save()}
};

function fillWal(){var v=$("wal").value;$("wal").innerHTML=S.acc.map(function(a){return '<option value="'+a.id+'">'+a.e+" "+esc(a.n)+"</option>"}).join("");if(v&&S.acc.some(function(a){return a.id===v}))$("wal").value=v}
function irow(x,k,del){var c=cat(x.c),d=new Date(x.t),a=S.acc.filter(function(a){return a.id===wid(x)})[0];
  var when=d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  return '<div class="item"'+(k==="e"?' data-o="'+x.id+'" style="cursor:pointer"':"")+'><div class="dot" style="background:'+c.c+'26">'+c.e+'</div><div class="m"><div>'+esc(x.n||c.n)+"</div><small>"+c.n+" · "+when+" · "+a.e+'</small></div><span class="a '+(k==="i"?"g":"")+'">'+(k==="i"?"+":"")+fmt(x.a)+"</span>"+(del&&k==="i"?'<button class="x" data-di="'+x.id+'" aria-label="Удалить">×</button>':"")+"</div>"}

render=function(){_render();incView()};

  fillWal();
  var r=range(S.per,off),I=S.inc.filter(function(x){return inR(x,r)}).sort(function(a,b){return b.t-a.t}),ti=sumR(I,r),te=sumR(S.ex,r),b=ti-te;
  $("kpi").innerHTML='<div><small>Доходы</small><b class="g">+'+fmt(ti)+'</b></div><div><small>Остаток (доходы − расходы)</small><b class="'+(b>=0?"g":"r")+'">'+fmt(b)+"</b></div>";
  $("ibox").innerHTML=I.length?"<h2>Доходы за период</h2>"+I.slice(0,40).map(function(x){return irow(x,"i",1)}).join(""):"";
}
$("ibox").addEventListener("click",function(e){var d=e.target.closest("[data-di]");if(!d)return;var id=+d.dataset.di;S.inc=S.inc.filter(function(x){return x.id!==id});save();render()});
/* аналитика */
function cmp(t,r0,r1){
  var E0=sumR(S.ex,r0),E1=sumR(S.ex,r1),I0=sumR(S.inc,r0),I1=sumR(S.inc,r1);
  var m=[["Расходы",E0,E1,-1],["Доходы",I0,I1,1],["Остаток",I0-E0,I1-E1,1]];
  return '<div class="lh" style="margin:4px 0">'+t+"</div>"+m.map(function(z){var d=z[2]?(z[1]-z[2])/Math.abs(z[2])*100:null,good=z[3]*(z[1]-z[2]);
    return '<div class="cr"><div>'+z[0]+"<small>было "+fmt(z[2])+"</small></div><b>"+fmt(z[1])+'</b><span class="dl '+(d==null||!good?"":good>0?"g":"r")+'">'+(d==null?"—":(d>=0?"▲ ":"▼ ")+Math.abs(Math.round(d))+"%")+"</span></div>"}).join("");
}
function insights(){
  var r=range("month",0),p=range("month",-1),L=S.ex.filter(function(x){return inR(x,r)}),o=[];
  if(!L.length)return["Пока мало данных за этот месяц."];
  var tot=0,by={},P={},wd=[0,0,0,0,0,0,0];
  L.forEach(function(x){tot+=x.a;by[x.c]=(by[x.c]||0)+x.a;wd[new Date(x.t).getDay()]+=x.a});
  S.ex.forEach(function(x){if(inR(x,p))P[x.c]=(P[x.c]||0)+x.a});
  var top=Object.keys(by).sort(function(a,b){return by[b]-by[a]})[0],wi=wd.indexOf(Math.max.apply(null,wd));
  o.push("Самая дорогая категория — "+cat(top).n.toLowerCase()+" ("+fmt(by[top])+").");
  o.push("Больше всего денег ты тратишь по "+WD[wi]+" ("+fmt(wd[wi])+").");
  o.push("Средние расходы в день — "+fmt(tot/new Date().getDate()));
  var best=null;Object.keys(by).forEach(function(c){if(P[c]>0&&by[c]>=tot*.05){var d=(by[c]-P[c])/P[c]*100;if(!best||Math.abs(d)>Math.abs(best.d))best={c:c,d:d}}});
  if(best&&Math.abs(best.d)>=5)o.push("На "+Math.abs(Math.round(best.d))+"% "+(best.d>0?"больше":"меньше")+" расходов пришлось на "+cat(best.c).n.toLowerCase()+" по сравнению с прошлым месяцем.");
  var inc=sumR(S.inc,r);if(inc>0)o.push(tot<=inc?"Ты откладываешь "+Math.round((inc-tot)/inc*100)+"% дохода.":"Расходы превысили доходы на "+fmt(tot-inc));
  var mx=L.slice().sort(function(a,b){return b.a-a.a})[0];o.push("Самая крупная трата — "+(mx.n||cat(mx.c).n)+" ("+fmt(mx.a)+").");
  return o;
}
function drawAn(){
  var m0=range("month",0);
  $("an").innerHTML="<h2>Анализ за "+m0[0].toLocaleDateString("ru-RU",{month:"long"})+'</h2><div class="card"><ul class="ins">'+insights().map(function(t){return"<li>"+t+"</li>"}).join("")+"</ul></div><h2>Сравнение</h2>"+
    '<div class="card">'+cmp("Этот месяц и прошлый",m0,range("month",-1))+"</div>"+'<div class="card">'+cmp("Этот год и прошлый",range("year",0),range("year",-1))+"</div>";
}
var _dc=drawChart;drawChart=function(){_dc();drawAn()};
/* календарь */
function drawCal(){
  var r=range("month",cmo),f=r[0],n=Math.round((r[1]-f)/864e5),pad=(f.getDay()+6)%7,E={},I={},i,h="";
  S.ex.forEach(function(x){if(inR(x,r)){var d=new Date(x.t).getDate();E[d]=(E[d]||0)+x.a}});
  S.inc.forEach(function(x){if(inR(x,r)){var d=new Date(x.t).getDate();I[d]=(I[d]||0)+x.a}});
  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(function(w){h+='<b class="wd">'+w+"</b>"});
  for(i=0;i<pad;i++)h+="<i></i>";
  for(i=1;i<=n;i++)h+='<div class="dc'+(cd===i?" on":"")+'" data-d="'+i+'"><span>'+i+"</span>"+(I[i]?'<em class="g">+'+kf(I[i])+"</em>":"")+(E[i]?'<em class="r">−'+kf(E[i])+"</em>":"")+"</div>";
  $("cg").innerHTML=h;$("cm").textContent=long("month",r);

  S.inc.forEach(function(x){if(x.t<r[1].getTime())end+=x.a});S.ex.forEach(function(x){if(x.t<r[1].getTime())end-=x.a});
  $("cend").innerHTML="Доходы за месяц: <b class=\"g\">+"+fmt(sumR(S.inc,r))+"</b> · Расходы: <b class=\"r\">−"+fmt(sumR(S.ex,r))+"</b><br>Остаток на конец месяца: <b>"+fmt(end)+"</b>";
  var s=cd?r[0].getTime()+(cd-1)*864e5:0,e=s+864e5,rr=[new Date(s),new Date(e)];
  var L=cd?S.inc.filter(function(x){return inR(x,rr)}).map(function(x){return irow(x,"i")}).concat(S.ex.filter(function(x){return inR(x,rr)}).map(function(x){return irow(x,"e")})):[];
  $("cday").innerHTML=cd?'<h2>'+cd+" "+long("month",r).split(" ")[0]+"</h2>"+(L.join("")||'<div class="empty">В этот день записей нет</div>'):"";
}

function drawGoals(){
  $("goals").innerHTML=S.goals.length?S.goals.map(function(g,i){

}
$("goals").addEventListener("click",function(e){
  var x=e.target.closest("[data-gx]"),p=e.target.closest("[data-gp]");

function fillSrch(){

function runSearch(){
  var q=$("q").value.trim().toLowerCase(),ty=$("qt").value,c=$("qc").value,w=$("qa").value,d1=$("q1").value,d2=$("q2").value,mn=num($("qmin").value),mx=num($("qmax").value);
  if(!(q||ty||c||w||d1||d2||mn||mx)){$("sres").innerHTML='<div class="empty">Задай условия: слово, категорию, счёт, даты или сумму.</div>';return}

  $("sres").innerHTML='<div class="lm" style="margin:8px 4px">Найдено: '+R.length+" · расходы "+fmt(te)+" · доходы "+fmt(ti)+"</div>"+R.slice(0,80).map(function(o){return irow(o[0],o[1])}).join("");
}
$("srch").addEventListener("input",runSearch);$("srch").addEventListener("change",runSearch);
$("sres").addEventListener("click",function(e){var o=e.target.closest("[data-o]");if(o)openD(+o.dataset.o)});
function dl(name,mime,txt){var u=URL.createObjectURL(new Blob([txt],{type:mime})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);$("xst").textContent="Файл "+name+" готов"}
$("xcsv").onclick=function(){
  var q=function(s){return'"'+String(s==null?"":s).replace(/"/g,'""')+'"'};
  var L=S.ex.map(function(x){return[x,"Расход"]}).concat(S.inc.map(function(x){return[x,"Доход"]})).sort(function(a,b){return a[0].t-b[0].t}).map(function(o){var x=o[0],a=S.acc.filter(function(a){return a.id===wid(x)})[0];return[ymd(new Date(x.t)),o[1],cat(x.c).n,a.n,x.n||"",String(x.a).replace(".",",")].map(q).join(";")});
  dl("rashody.csv","text/csv;charset=utf-8","\ufeffДата;Тип;Категория;Счёт;Описание;Сумма\r\n"+L.join("\r\n"));
};
$("xjson").onclick=function(){dl("rashody-"+ymd(new Date())+".json","application/json",JSON.stringify({v:2,S:S}))};
$("xtxt").onclick=function(){
  var r=range("month",0),t="ОТЧЁТ ЗА "+long("month",r).toUpperCase()+"\nДоходы: "+fmt(sumR(S.inc,r))+"\nРасходы: "+fmt(sumR(S.ex,r))+"\nОстаток: "+fmt(sumR(S.inc,r)-sumR(S.ex,r))+"\n\n"+insights().map(function(x){return"• "+x}).join("\n")+"\n\nСчета:\n"+S.acc.map(function(a){return a.n+": "+fmt(accBal(a))}).join("\n");
  dl("otchet.txt","text/plain;charset=utf-8",t);
};
function drawMore(){drawAcc();drawGoals();fillSrch();runSearch()}
mergeIn=function(d){
  if(!d||!Array.isArray(d.ex))throw 0;var n=0,k;
  function mg(a,b){var h={};a.forEach(function(x){h[x.id]=1});(b||[]).forEach(function(x){if(x&&x.id&&!h[x.id]){a.push(x);h[x.id]=1;n++}})}
  mg(S.ex,d.ex);mg(S.inc,d.inc);mg(S.goals,d.goals);
  (d.acc||[]).forEach(function(a){if(!S.acc.some(function(z){return z.id===a.id}))S.acc.push(a)});
  for(k in (d.learn||{}))if(!S.learn[k])S.learn[k]=d.learn[k];
  (d.lim||[]).forEach(function(l){if(!S.lim.some(function(z){return z.id===l.id}))S.lim.push(l)});
  S.ex.sort(function(a,b){return b.t-a.t});save();refresh();return n;
};
var _view=view;
view=function(v){["cal","more"].forEach(function(k){$("v-"+k).hidden=k!==v});_view(v);if(v==="cal")drawCal();if(v==="more")drawMore()};
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
onType();render();
</script>
<script>
/* v3: регулярные платежи и виды гистограммы */
var FR={month:"каждый месяц",week:"каждую неделю",year:"каждый год"},seq=0,ctype="bars";
if(!S.rec)S.rec=[];
function adv(r){var d=new Date(r.nx);
  if(r.f==="week"){d.setDate(d.getDate()+7);return d.getTime()}
  var t=new Date(d.getFullYear(),d.getMonth()+(r.f==="year"?12:1),1,8),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(r.dm,dim));return t.getTime();
}
function runRec(){
  var n=0,now=Date.now();
  S.rec.forEach(function(r){var g=0;while(r.nx<=now&&g++<400){
    (r.k==="i"?S.inc:S.ex).push({id:now*1000+(seq++),t:r.nx,a:r.a,n:r.n,c:r.c,w:r.w,rr:r.id});n++;r.nx=adv(r)}});
  if(n){S.ex.sort(function(a,b){return b.t-a.t});S.inc.sort(function(a,b){return b.t-a.t});save()}
  return n;
}
function drawRec(){
  var c=$("rcat").value,w=$("rw").value;
  $("rcat").innerHTML='<optgroup label="Расходы">'+CATS.map(function(x){return '<option value="'+x.id+'">'+x.e+" "+x.n+"</option>"}).join("")+'</optgroup><optgroup label="Доходы">'+CIN.map(function(x){return '<option value="'+x.id+'">'+x.e+" "+x.n+"</option>"}).join("")+"</optgroup>";
  $("rw").innerHTML=S.acc.map(function(a){return '<option value="'+a.id+'">'+a.e+" "+esc(a.n)+"</option>"}).join("");
  if(c)$("rcat").value=c;if(w&&S.acc.some(function(a){return a.id===w}))$("rw").value=w;
  $("rlist").innerHTML=S.rec.length?S.rec.map(function(r,i){
    return '<div class="card"><div class="lh"><span>🔁 '+esc(r.n)+'</span><button class="x" data-rx="'+i+'" aria-label="Удалить">×</button></div><div class="lm">'+cat(r.c).n+" · "+(r.k==="i"?'<span class="g">+':"<span>")+fmt(r.a)+"</span> · "+FR[r.f]+'</div><div class="lm">Следующий: '+new Date(r.nx).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})+"</div></div>"}).join(""):'<div class="empty">Регулярных платежей пока нет.<br>Например: аренда, интернет, зарплата.</div>';
}
$("rlist").addEventListener("click",function(e){var b=e.target.closest("[data-rx]");if(!b)return;S.rec.splice(+b.dataset.rx,1);save();drawRec()});
$("radd").onclick=function(){
  var n=$("rn").value.trim(),a=num($("ra").value);if(!n||!(a>0))return;
  var c=$("rcat").value,s=$("rd").value?new Date($("rd").value+"T08:00:00"):new Date();if(!$("rd").value)s.setHours(8,0,0,0);
  S.rec.push({id:Date.now(),n:n,a:a,c:c,k:CIN.some(function(x){return x.id===c})?"i":"e",w:$("rw").value,f:$("rf").value,dm:s.getDate(),nx:s.getTime()});
  $("rn").value="";$("ra").value="";$("rd").value="";save();runRec();drawRec();render();
};
var _dm=drawMore;drawMore=function(){_dm();drawRec()};
var _mi=mergeIn;
mergeIn=function(d){var n=_mi(d);(d.rec||[]).forEach(function(r){if(r&&r.id&&!S.rec.some(function(z){return z.id===r.id}))S.rec.push(r)});save();return n};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&runRec())refresh()});
/* виды гистограммы */
function blab(b){var d=b.r[0];return cp==="day"?d.getDate():cp==="week"?d.getDate()+"."+("0"+(d.getMonth()+1)).slice(-2):cp==="month"?d.toLocaleDateString("ru-RU",{month:"short"}).replace(".",""):d.getFullYear()}
function chartView(){
  $("ttabs").innerHTML=[["bars","Столбцы"],["pair","Доход и расход"],["stack","По категориям"],["line","Линия"]].map(function(t){return '<button data-t="'+t[0]+'" class="'+(ctype===t[0]?"on":"")+'">'+t[1]+"</button>"}).join("");
  var el=$("chart"),leg=$("cleg");leg.innerHTML="";el.className="chart m"+ctype;
  if(ctype==="bars")return;
  var n={day:14,week:12,month:12,year:5}[cp],bs=[],i,mx=0,col=function(k,inner,cls){return '<div class="col'+(k===csel?" on":"")+'" data-i="'+k+'"><div class="bw '+cls+'">'+inner+"</div><span>"+blab(bs[k])+"</span></div>"};
  for(i=n-1;i>=0;i--){var r=range(cp,-i);bs.push({r:r,e:sumR(S.ex,r),i:sumR(S.inc,r),by:{}})}
  bs.forEach(function(b){S.ex.forEach(function(x){if(inR(x,b.r))b.by[x.c]=(b.by[x.c]||0)+x.a})});
  if(ctype==="stack"){
    bs.forEach(function(b){mx=Math.max(mx,b.e)});mx=mx||1;
    el.innerHTML=bs.map(function(b,k){return col(k,CATS.map(function(c){return b.by[c.id]?'<i style="height:'+b.by[c.id]/mx*100+"%;background:"+c.c+'"></i>':""}).join(""),"s")}).join("");
    var tt={};bs.forEach(function(b){for(var c in b.by)tt[c]=(tt[c]||0)+b.by[c]});
    leg.innerHTML=Object.keys(tt).sort(function(a,b){return tt[b]-tt[a]}).slice(0,7).map(function(c){return '<span><b style="background:'+cat(c).c+'"></b>'+cat(c).n+"</span>"}).join("");
  }else{
    bs.forEach(function(b){mx=Math.max(mx,b.e,b.i)});mx=mx||1;
    if(ctype==="pair")el.innerHTML=bs.map(function(b,k){return col(k,'<i style="height:'+b.e/mx*100+'%;background:#ef4444"></i><i style="height:'+b.i/mx*100+'%;background:#16a34a"></i>',"p")}).join("");
    else{
      var pe=[],pi=[];bs.forEach(function(b,k){var x=(k+.5)/n*100;pe.push(x+","+(100-b.e/mx*100));pi.push(x+","+(100-b.i/mx*100))});
      el.innerHTML='<svg class="ls" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="'+pi.join(" ")+'" fill="none" stroke="#16a34a" stroke-width="2" vector-effect="non-scaling-stroke"/><polyline points="'+pe.join(" ")+'" fill="none" stroke="#ef4444" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'+
        bs.map(function(b,k){return col(k,'<i class="dp" style="bottom:'+b.i/mx*100+'%;background:#16a34a"></i><i class="dp" style="bottom:'+b.e/mx*100+'%;background:#ef4444"></i>',"")}).join("");
    }
    leg.innerHTML='<span><b style="background:#ef4444"></b>Расходы</span><span><b style="background:#16a34a"></b>Доходы</span>';
    var s=bs[csel];if(s)$("cavg").textContent="Доходы: +"+fmt(s.i)+" · Остаток: "+fmt(s.i-s.e);
  }
}
var _dc3=drawChart;drawChart=function(){_dc3();chartView()};
$("ttabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;ctype=b.dataset.t;drawChart()});
runRec();render();
</script>
